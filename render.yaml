# Aethron on Render — the MCP tools for an agent that is not on your
# computer, plus the previews it publishes.
#   1. render.com -> New -> Blueprint -> this repo
#   2. Render generates AETHRON_MCP_TOKEN; copy it into the agent's MCP
#      settings (Authorization: Bearer <token>). Anyone with the token
#      controls this Aethron — keep it secret.
#   3. The agent's MCP address is https://<service>.onrender.com/mcp
#
# Plan: Starter or above. The free plan sleeps after 15 minutes (the first
# call after that waits about a minute) and has no disk, so prepared
# templates and previews vanish on every restart. Browser checks need
# memory: if builds stop with "out of memory", move up a plan.
services:
  - type: web
    name: aethron
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: AETHRON_MCP_TOKEN
        generateValue: true
    disk:
      name: aethron-data
      mountPath: /data
      sizeGB: 5
