# The Aethron website (aethron.jomiez.com), as static files on Cloudflare.
# Deployed by .github/workflows/deploy-website.yml. Static asset requests on
# Workers are free and unmetered, so the site costs nothing however many
# people open it (it used to run on Render's free plan, which allows 5 GB a
# month and then bills $0.15 a GB).
name = "aethron-website"
compatibility_date = "2026-10-01"
workers_dev = false

# A custom domain: Cloudflare makes the DNS record and the certificate
# itself. Needs jomiez.com on this Cloudflare account and the API token
# allowed to edit it; until then the workflow deploys wrangler.fallback.toml
# (www.aethron.site) instead.
routes = [
  { pattern = "aethron.jomiez.com", custom_domain = true },
]

[assets]
directory = "../../projects/aethron-web/site"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
