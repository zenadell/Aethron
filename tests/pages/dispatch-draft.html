<!doctype html>
<!-- A STAND-IN for the page Aethron 1.1.33 wrote from tests/pages/dispatch.png
     (the owner's run; its HTML stayed on their Mac). Rebuilt from their
     screenshot of it with the same faults: monospace body type, a smaller
     headline in another face, the paragraph broken in four lines, and the
     watercolour drawn as CSS circles and blurred waves. Used to measure what
     the fitting and picture passes do to a draft like that. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dispatch — The ideas worth your inbox.</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;1,400&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1E2A1F; --paper:#DCDFCC; --water:#3F6457; --hair:#A4552E; --skin:#C49A78; }
  * { box-sizing: border-box; }
  body { margin:0; background: var(--paper); color: var(--ink); font-family:'Roboto Mono', monospace; }
  header { display:flex; justify-content:space-between; align-items:center; padding:14px 18px; position:relative; z-index:3; }
  .logo { display:flex; align-items:center; gap:7px; font-family:'Fraunces', serif; font-size:16px; color:var(--ink); text-decoration:none; }
  .logo i { width:9px; height:9px; display:grid; grid-template-columns:1fr 1fr; gap:1px; }
  .logo i b { background:var(--ink); }
  nav { display:flex; gap:30px; }
  nav a { font-size:10px; letter-spacing:.14em; color:var(--ink); text-decoration:none; text-transform:uppercase; }
  nav a:last-child { border-bottom:1px solid var(--ink); }
  main { position:relative; min-height:703px; overflow:hidden; }
  .hero { position:relative; z-index:2; text-align:center; padding-top:52px; }
  .eyebrow { font-size:9px; letter-spacing:.2em; margin:0 0 16px; }
  h1 { font-family:'Fraunces', serif; font-weight:400; font-size:44px; line-height:1.05; margin:0 0 20px; }
  h1 em { display:block; }
  .lede { font-size:11px; line-height:1.4; max-width:240px; margin:0 auto 24px; }
  form { display:inline-flex; background:#E8E8D8; border-radius:99px; padding:4px; box-shadow:0 4px 18px rgba(0,0,0,.12); }
  input { border:0; background:transparent; font:inherit; font-size:11px; width:190px; padding:0 14px; }
  button { border:0; border-radius:99px; background:#1C2A20; color:#fff; font:inherit; font-size:11px; padding:10px 18px; }
  .free { font-family:'Fraunces', serif; font-style:italic; font-size:11px; margin-top:16px; }
  .water { position:absolute; left:0; right:0; top:360px; bottom:0; background:linear-gradient(#9FB7A8, #3F6457 30%, #2C4A3E); z-index:1; }
  .hair { position:absolute; left:0; right:0; top:340px; height:70px; background:var(--hair); filter:blur(8px); border-radius:50%; z-index:1; opacity:.9; }
  .face { position:absolute; left:50%; top:410px; width:330px; height:330px; margin-left:-165px; border-radius:50%; background:radial-gradient(circle at 50% 40%, #D3A884, var(--skin)); filter:blur(1px); z-index:1; }
</style>
</head>
<body>
<header>
  <a class="logo" href="#"><i><b></b><b></b><b></b><b></b></i>dispatch</a>
  <nav><a href="#">Latest issue</a><a href="#">Archive</a><a href="#">About</a><a href="#">Manifesto</a><a href="#">Get started</a></nav>
</header>
<main>
  <div class="water"></div><div class="hair"></div><div class="face"></div>
  <section class="hero">
    <p class="eyebrow">THE WEEKLY DISPATCH · ISSUE N°142</p>
    <h1>The ideas worth <em>your inbox.</em></h1>
    <p class="lede">One email every Friday. Big ideas, clear thinking, and zero noise — for 24,000 readers who like their insights sharp and their inboxes calm.</p>
    <form><label for="e" hidden>Email</label><input id="e" type="email" placeholder="you@example.com"><button>Subscribe</button></form>
    <p class="free">Free forever. Unsubscribe anytime.</p>
  </section>
</main>
</body>
</html>
