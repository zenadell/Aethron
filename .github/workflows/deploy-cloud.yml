# Ships the admin & control layer to Supabase: the database tables
# (supabase_schema.sql, then supabase/admin_schema.sql — both safe to run
# again) and the `aethron` edge function. Runs on every push to main that
# touches them, and by hand from the Actions tab.
#
# Repository secrets (GitHub → Settings → Secrets and variables → Actions):
#   AETHRON_SUPABASE_URL      already set (https://<ref>.supabase.co)
#   SUPABASE_ACCESS_TOKEN     a personal access token from
#                             supabase.com/dashboard/account/tokens — this
#                             is what lets this job change the project
#                             (project-scoped tokens need: Project read,
#                             Database read+write, Edge Functions and
#                             Secrets read+write; a legacy token also works)
#   AETHRON_ADMIN_EMAILS      who may sign in to the admin as owner,
#                             comma-separated (e.g. you@jomiez.com)
#   AETHRON_ADMIN_MASTER_KEY  optional: a long random string that signs in
#                             as owner from anywhere (the console's "Admin
#                             API key" box, or an agent). 24+ characters.
# Without SUPABASE_ACCESS_TOKEN the job says so and changes nothing.
name: Deploy Aethron cloud (admin & control)

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "supabase_schema.sql"
      - "tests/cloud/**"
      - ".github/workflows/deploy-cloud.yml"
  workflow_dispatch:

concurrency:
  group: deploy-cloud
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Test the function first
        run: bun test tests/cloud

      - name: Check the secrets
        id: have
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          URL: ${{ secrets.AETHRON_SUPABASE_URL }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$URL" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN (or AETHRON_SUPABASE_URL) is not set — nothing was deployed. Add it to deploy the admin."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REF=$(echo "$URL" | sed -E 's#https://([^.]+)\.supabase\.co.*#\1#')
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Apply the database tables
        if: steps.have.outputs.ok == 'true'
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ steps.have.outputs.ref }}
        run: |
          for f in supabase_schema.sql supabase/admin_schema.sql; do
            body=$(python3 -c 'import json,sys; print(json.dumps({"query": open(sys.argv[1]).read()}))' "$f")
            code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST \
              "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$body")
            echo "$f -> $code"
            if [ "$code" -ge 300 ]; then cat /tmp/out.json; exit 1; fi
          done

      - name: Let sign-in come back to the admin
        # Google and email links return to an address Supabase must allow;
        # anything not on the list is sent to the project's Site URL instead
        # (the "sign-in doesn't work" that looks like Supabase being down).
        if: steps.have.outputs.ok == 'true'
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ steps.have.outputs.ref }}
        run: |
          api="https://api.supabase.com/v1/projects/$REF/config/auth"
          code=$(curl -sS -o /tmp/auth.json -w '%{http_code}' "$api" -H "Authorization: Bearer $TOKEN")
          if [ "$code" -ge 300 ]; then
            echo "::warning::Could not read the sign-in settings ($code). Add https://aethron.jomiez.com/admin to Supabase → Authentication → URL Configuration → Redirect URLs by hand, or give the access token Auth config read+write."
            exit 0
          fi
          python3 - <<'PY'
          import json
          c = json.load(open("/tmp/auth.json"))
          have = [u.strip() for u in (c.get("uri_allow_list") or "").split(",") if u.strip()]
          print("Site URL:", c.get("site_url"))
          print("Allowed return addresses before:", have or "(none)")
          want = ["https://aethron.jomiez.com/admin", "https://aethron.jomiez.com/admin/**",
                  "http://127.0.0.1:*/auth/callback", "http://localhost:*/auth/callback"]
          add = [u for u in want if u not in have]
          json.dump({"uri_allow_list": ",".join(have + add)}, open("/tmp/patch.json", "w"))
          open("/tmp/add.txt", "w").write(" ".join(add))
          print("Adding:", add or "(nothing — already allowed)")
          PY
          if [ -s /tmp/add.txt ]; then
            code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X PATCH "$api" -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" -d @/tmp/patch.json)
            echo "update -> $code"
            if [ "$code" -ge 300 ]; then cat /tmp/out.json; echo "::warning::Could not update the sign-in settings ($code) — add the addresses above by hand."; fi
          fi

      # Installed from npm into a local folder: supabase/setup-cli asks
      # GitHub's API for "latest", which is rate-limited for shared runners
      # and failed the deploy of #129 in 19 seconds. Held at major 2: 3.x
      # replaced --project-ref (used below) with --remote=.
      - name: Install the Supabase CLI
        if: steps.have.outputs.ok == 'true'
        run: |
          for i in 1 2 3; do npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/sb" supabase@2 && break; sleep $((i*10)); done
          echo "$RUNNER_TEMP/sb/node_modules/.bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/sb/node_modules/.bin/supabase" --version

      - name: Set the function's secrets
        if: steps.have.outputs.ok == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ steps.have.outputs.ref }}
          ADMIN_EMAILS: ${{ secrets.AETHRON_ADMIN_EMAILS }}
          MASTER: ${{ secrets.AETHRON_ADMIN_MASTER_KEY }}
        run: |
          args=()
          [ -n "$ADMIN_EMAILS" ] && args+=("ADMIN_EMAILS=$ADMIN_EMAILS")
          [ -n "$MASTER" ] && args+=("ADMIN_MASTER_KEY=$MASTER")
          if [ ${#args[@]} -gt 0 ]; then
            supabase secrets set --yes --project-ref "$REF" "${args[@]}"
          else
            echo "::warning::AETHRON_ADMIN_EMAILS is not set — nobody can sign in to the admin yet."
          fi

      - name: Deploy the function
        if: steps.have.outputs.ok == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ steps.have.outputs.ref }}
        run: supabase functions deploy aethron --yes --project-ref "$REF" --no-verify-jwt

      - name: It answers
        if: steps.have.outputs.ok == 'true'
        env:
          URL: ${{ secrets.AETHRON_SUPABASE_URL }}
        run: |
          for i in 1 2 3 4 5 6; do
            out=$(curl -sS "$URL/functions/v1/aethron/control" || true)
            echo "$out"
            echo "$out" | grep -q '"ai_mode"' && exit 0
            sleep 10
          done
          echo "::error::the function did not answer /control"; exit 1
