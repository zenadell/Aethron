# Every push to main builds Aethron on a Mac, checks it, and publishes it
# to the update feed the installed app reads. The owner's app then
# updates itself — nobody has to build or install anything by hand, and
# a session working in the cloud (no Mac) can ship to the owner's Mac.
#
# Needs two repository secrets (GitHub → Settings → Secrets → Actions):
#   AETHRON_SUPABASE_URL   https://<project>.supabase.co
#   SUPABASE_SERVICE_KEY   the service_role key (never commit it)
name: Release Aethron for Mac

on:
  push:
    branches: [main]
    # Only changes to the app cut a Mac release (a Mac minute counts 10x
    # against the Actions allowance). The website deploys on Netlify, the
    # hosting server and the cloud function have their own deploys, and
    # tests and docs alone change nothing a person installs.
    paths-ignore:
      - "projects/aethron-web/**"
      - "render.website.yaml"
      - "cloud/**"
      - "supabase/**"
      - "admin_ui/**"
      - "tests/**"
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/deploy-*.yml"
      - ".github/workflows/keep-supabase-awake.yml"
      - ".github/workflows/mac-shot2code.yml"
  workflow_dispatch:

concurrency:
  group: release-mac
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      AETHRON_REPORTS: "off"      # the release's own checks are not users' failures
      AETHRON_SUPABASE_URL: ${{ secrets.AETHRON_SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      AETHRON_GOOGLE_CLIENT_ID: ${{ secrets.AETHRON_GOOGLE_CLIENT_ID }}
      AETHRON_GOOGLE_CLIENT_SECRET: ${{ secrets.AETHRON_GOOGLE_CLIENT_SECRET }}
      AETHRON_NETLIFY_CLIENT_ID: ${{ secrets.AETHRON_NETLIFY_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check the secrets are set
        run: |
          if [ -z "$AETHRON_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error::Add AETHRON_SUPABASE_URL and SUPABASE_SERVICE_KEY in GitHub → Settings → Secrets → Actions"
            exit 1
          fi

      # 1.1.<run number> always rises, so every installed copy sees the
      # new build as an update (local releases used 1.0.x).
      - name: Set the version
        run: |
          VER="1.1.${{ github.run_number }}"
          python3 - "$VER" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path("aethron_update.py")
          s = p.read_text()
          new = re.sub(r'^VERSION = "[^"]*"', f'VERSION = "{sys.argv[1]}"', s, count=1, flags=re.M)
          if new == s:
              raise SystemExit("could not set VERSION in aethron_update.py")
          p.write_text(new)
          PY
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "version $VER"

      # A broken release installs itself onto every user, so nothing is
      # published unless these pass.
      - name: Checks before building
        run: |
          python3 -m py_compile studio.py forge.py forge_mcp.py desktop.py aethron_update.py aethron_preview.py
          python3 -c "import re, studio, pathlib; pathlib.Path('/tmp/_rel.cjs').write_text('\n'.join(re.findall(r'<script>(.*?)</script>', studio.INDEX_HTML, re.S)))"
          node --check /tmp/_rel.cjs
          python3 aethron_update.py --selftest
          python3 tests/engine_battery.py
          python3 tests/provider_battery.py
          python3 aethron_bridge.py --selftest

      # The app reads where to find updates (supabase_url) and its login
      # setup from aethron_config.json inside the bundle. That file is
      # never committed (it holds API keys locally), so the release copy
      # is built from release_config.json — the shareable parts only.
      # Without it a release cannot find the next one.
      - name: Add the release settings
        run: |
          python3 - <<'PY2'
          import json, os
          c = json.load(open("release_config.json"))
          # Google sign-in: from repo secrets, never from the repo itself
          for k, env in (("google_client_id", "AETHRON_GOOGLE_CLIENT_ID"),
                         ("google_client_secret", "AETHRON_GOOGLE_CLIENT_SECRET")):
              if os.environ.get(env):
                  c[k] = os.environ[env]
          # Netlify browser sign-in (Publish): a public client id, also a secret for tidiness
          if os.environ.get("AETHRON_NETLIFY_CLIENT_ID"):
              c["netlify_client_id"] = os.environ["AETHRON_NETLIFY_CLIENT_ID"]
          if "google_client_id" not in c:
              print("::warning::no AETHRON_GOOGLE_CLIENT_ID secret — Google sign-in is off in this release")
          json.dump(c, open("aethron_config.json", "w"))
          PY2
          python3 -c "import json;c=json.load(open('aethron_config.json'));assert c.get('supabase_url'),'no supabase_url';assert 'ai' not in c,'API keys must not ship'"

      - name: Build the app
        run: bash build_desktop.sh

      - name: Check the built app
        run: |
          test -d dist/Aethron.app
          # the release must know where its next update lives
          python3 -c "import json;c=json.load(open('dist/Aethron.app/Contents/Resources/aethron_config.json'));assert c.get('supabase_url');assert 'ai' not in c"
          dist/Aethron.app/Contents/MacOS/Aethron --forge 2>&1 | grep -q "known:" \
            || { echo "::error::the packaged engine does not start"; exit 1; }
          # screenshot-to-page needs text recognition INSIDE the app
          OCR=$(find dist/Aethron.app -name aethron_ocr -type f | head -1)
          test -n "$OCR" || { echo "::error::the app ships no text-recognition helper"; exit 1; }
          # PyInstaller thins it to the app's own architecture; it must
          # carry every architecture the app itself runs on
          for A in $(lipo -archs dist/Aethron.app/Contents/MacOS/Aethron); do
            lipo -archs "$OCR" | grep -qw "$A" \
              || { echo "::error::the OCR helper lacks $A, which the app runs on"; exit 1; }
          done
          "$OCR" docs/screenshots/library.png | grep -q '"text"' \
            || { echo "::error::the packaged OCR helper read no text"; exit 1; }
          python3 tests/ocr_frozen.py dist/Aethron.app
          # paste and drop read the Mac's own pasteboards when the web view
          # hands over nothing (a private board: nobody's clipboard is touched)
          python3 aethron_native.py --selftest | tee /tmp/native.log
          grep -q "VERDICT: PASS" /tmp/native.log \
            || { echo "::error::reading images off the Mac's pasteboard does not work"; exit 1; }
          # screenshot to code with the Mac's own OCR: pictures stay
          # pictures, type and placement fitted from the pixels
          python3 tests/pictures_fit_battery.py | tee /tmp/pictures.log
          grep -Eq "VERDICT: (PASS|SKIPPED)" /tmp/pictures.log \
            || { echo "::error::screenshot to code no longer fits type or keeps pictures"; exit 1; }
          # a real migration through the packaged app's own tools
          python3 tests/frozen_migration.py dist/Aethron.app
          # needs a prepared template on disk; reports SKIPPED here
          python3 tests/preview_battery.py agero dist/Aethron.app

      - name: Zip
        run: ditto -c -k --sequesterRsrc --keepParent dist/Aethron.app dist/Aethron-mac.zip

      - name: Publish to the update feed
        env:
          NOTES: ${{ github.event.head_commit.message || 'Maintenance release' }}
        # A merge commit's first line is "Merge pull request #N from …",
        # which tells the person nothing; the PR title on the next line does.
        run: |
          LINE="$(printf '%s\n' "$NOTES" | grep -v '^Merge pull request' | grep -v '^[[:space:]]*$' | head -1)"
          python3 publish_release.py "$VER" dist/Aethron-mac.zip "${LINE:-Maintenance release}"

      - name: Keep the zip on the run
        uses: actions/upload-artifact@v4
        with:
          name: Aethron-mac-${{ env.VER }}
          path: dist/Aethron-mac.zip
          retention-days: 7
