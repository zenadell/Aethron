# The Aethron marketing site (aethron.jomiez.com).
# website/ is a hand-written static page: no build step, nothing to install.
# The old site (projects/aethron-site, a forge migration) is kept in the repo
# but no longer published.
[build]
  base = "website"
  publish = "."
  command = "true"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
