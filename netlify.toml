# The Aethron marketing site (aethron.jomiez.com).
# projects/aethron-web is the Kaviyan Framer template migrated with forge:
# pristine/ is the untouched template, copy_map.json holds every change.
# Netlify rebuilds it from source on every push and points /download at the
# newest Mac release (netlify_post.py). forge is pure stdlib: nothing to install.
[build]
  base = "projects/aethron-web"
  command = "python3 ../../forge.py build && python3 netlify_post.py"
  publish = "site"

[build.environment]
  PYTHON_VERSION = "3.11"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
