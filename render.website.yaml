        destination: /blog-ai-video-editing-guide.html
      - type: rewrite
        source: /projects/glow-serum-launch
        destination: /projects-glow-serum-launch.html
      - type: rewrite
        source: /projects/watermelon-rind
        destination: /projects-watermelon-rind.html
      - type: rewrite
        source: /services/brand-kit-setup
        destination: /services-brand-kit-setup.html
      - type: rewrite
        source: /services/team-onboarding
        destination: /services-team-onboarding.html
      - type: rewrite
        source: /services/template-design
        destination: /services-template-design.html
      - type: rewrite
        source: /services/motion-systems
        destination: /services-motion-systems.html
      - type: rewrite
