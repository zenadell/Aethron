# The Aethron marketing site (aethron.jomiez.com) as a Render static site.
# No backend: forge builds plain files and post_build.py points /download at
# the newest Mac release. Free on Render (static sites have no plan).
#   render.com -> New -> Blueprint -> this repo -> Blueprint Path:
#   render.website.yaml
services:
  - type: web
    name: aethron-website
    runtime: static
    rootDir: projects/aethron-web
    buildCommand: python3 ../../forge.py build && python3 post_build.py
    staticPublishPath: site
    autoDeployTrigger: commit
    domains:
      - aethron.jomiez.com
    headers:
      # Builds rewrite chunks in place (stamped ?v=), so a browser must ask
      # again rather than run last week's copy.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    # Rules never apply where a file exists, so the last one is a fallback.
    # One rewrite per template page (generated from forge.json routes).
    routes:
      - type: redirect
        source: /assets/downloads/Aethron-mac.zip
        destination: /download/
      - type: rewrite
        source: /download
        destination: /download/index.html
      - type: rewrite
        source: /download/mac
        destination: /download/mac/index.html
      - type: rewrite
        source: /start
        destination: /start/index.html
      - type: rewrite
        source: /jomiez
        destination: /jomiez/index.html
      - type: rewrite
        source: /blog/assets/*
        destination: /assets/*
      - type: rewrite
        source: /gallery/assets/*
        destination: /assets/*
      - type: rewrite
        source: /legal/assets/*
        destination: /assets/*
      - type: rewrite
        source: /projects/assets/*
        destination: /assets/*
      - type: rewrite
        source: /services/assets/*
        destination: /assets/*
      - type: rewrite
        source: /blog/reusable-video-editing-workflows
        destination: /blog-reusable-video-editing-workflows.html
      - type: rewrite
        source: /blog/maison-vire-120-localized-edits
        destination: /blog-maison-vire-120-localized-edits.html
      - type: rewrite
        source: /projects/sodas-back-but-better
        destination: /projects-sodas-back-but-better.html
      - type: rewrite
        source: /services/localization-at-scale
        destination: /services-localization-at-scale.html
      - type: rewrite
        source: /blog/northfold-4x-social-cuts
        destination: /blog-northfold-4x-social-cuts.html
      - type: rewrite
        source: /projects/fit-for-any-forecast
        destination: /projects-fit-for-any-forecast.html
      - type: rewrite
