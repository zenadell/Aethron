<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Aethron Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d97757'/%3E%3C/svg%3E">
<style>
:root{--bg:#0b0b0c;--panel:#141316;--panel2:#1b1a1e;--field:#0f0e10;--line:#26252a;--line2:#35333a;
--tx:#eceaf0;--dim:#a5a2ad;--lo:#76737d;--acc:#d97757;--acc2:#e89a7c;--ok:#7ec699;--warn:#e8b04b;--err:#e5695e;
--blue:#7aa7ff;--r:12px;--ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,system-ui,sans-serif;
--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f6f4f1;--panel:#fff;--panel2:#f2efea;
--field:#fff;--line:#e5e0d8;--line2:#d6cfc4;--tx:#1b1916;--dim:#5f5a53;--lo:#8b857c}}
:root[data-theme="light"]{--bg:#f6f4f1;--panel:#fff;--panel2:#f2efea;--field:#fff;--line:#e5e0d8;--line2:#d6cfc4;
--tx:#1b1916;--dim:#5f5a53;--lo:#8b857c}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--tx);font:14px/1.45 var(--ui)}
a{color:var(--acc2)}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;
  padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover{border-color:var(--lo)}
button.primary{background:var(--acc);border-color:var(--acc);color:#1c0f09;font-weight:600}
button.danger{border-color:#7a2f2a;color:var(--err)}
button.danger.solid{background:var(--err);color:#200a08;border-color:var(--err);font-weight:600}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;color:var(--tx);background:var(--field);border:1px solid var(--line2);
  border-radius:10px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(217,119,87,.45);outline-offset:1px}
label{display:block;font-size:12px;color:var(--dim);margin:0 0 4px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
nav{border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto;
  display:flex;flex-direction:column;gap:2px;background:var(--panel)}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 16px;font-weight:700;letter-spacing:.2px}
.brand .mk{width:26px;height:26px;border-radius:8px;background:linear-gradient(140deg,#e89a7c,#b9553a)}
.brand small{display:block;font-weight:500;color:var(--lo);font-size:11px}
nav a{display:flex;align-items:center;gap:9px;color:var(--dim);text-decoration:none;padding:8px 10px;border-radius:9px}
nav a:hover{background:var(--panel2);color:var(--tx)}
nav a.on{background:var(--panel2);color:var(--tx);box-shadow:inset 2px 0 0 var(--acc)}
nav .sep{height:1px;background:var(--line);margin:10px 6px}
nav .me{margin-top:auto;padding:10px;font-size:12px;color:var(--lo);border-top:1px solid var(--line)}
main{padding:22px 26px 60px;min-width:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:22px;font-weight:650;letter-spacing:-.2px;flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;
  border:1px solid var(--line2);color:var(--dim)}
.pill.ok{color:var(--ok);border-color:rgba(126,198,153,.35)}.pill.err{color:var(--err);border-color:rgba(229,105,94,.45)}
.pill.warn{color:var(--warn);border-color:rgba(232,176,75,.4)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--lo);display:inline-block}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(126,198,153,.18)}
.grid{display:grid;gap:14px}
.k4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.k2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h3{font-size:13px;font-weight:600;color:var(--dim);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.kpi .n{font-size:28px;font-weight:650;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--lo);font-size:12px;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--lo);font-weight:500;font-size:12px;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}
.tw{overflow:auto;max-width:100%}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.mono{font-family:var(--mono);font-size:12px}
.lo{color:var(--lo)}.dim{color:var(--dim)}.err{color:var(--err)}.okc{color:var(--ok)}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.row>*{flex:1;min-width:150px}
.row .tight{flex:0 0 auto;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.bar{height:8px;border-radius:5px;background:var(--panel2);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:6px}
.bars>div{flex:1;background:linear-gradient(180deg,var(--acc2),var(--acc));border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars>div:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);
  background:var(--panel2);border:1px solid var(--line2);padding:3px 7px;border-radius:6px;font-size:11px;white-space:nowrap}
.kill{display:flex;align-items:center;gap:16px;padding:18px;border-radius:14px;border:1px solid var(--line2);background:var(--panel2)}
.kill.on{border-color:#7a2f2a;background:linear-gradient(180deg,rgba(229,105,94,.10),transparent)}
.kill .big{font-size:17px;font-weight:650}
.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--line2);border-radius:99px;transition:.2s;cursor:pointer}
.switch span::before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--ok)}.switch input:checked+span::before{transform:translateX(18px)}
.feat{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.feat:last-child{border-bottom:0}
.drawer{position:fixed;inset:0 0 0 auto;width:min(860px,100vw);background:var(--bg);border-left:1px solid var(--line2);
  z-index:50;overflow:auto;padding:22px;box-shadow:-20px 0 60px rgba(0,0,0,.4)}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0}
.tabs button{border:0;background:transparent;border-radius:8px 8px 0 0;color:var(--dim)}
.tabs button.on{color:var(--tx);box-shadow:inset 0 -2px 0 var(--acc)}
pre{white-space:pre-wrap;word-break:break-word;background:var(--field);border:1px solid var(--line);border-radius:10px;
  padding:10px;font:12px/1.5 var(--mono);max-height:420px;overflow:auto}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);
  padding:10px 16px;border-radius:12px;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.err{border-color:#7a2f2a;color:var(--err)}
.chat{display:grid;grid-template-columns:230px 1fr;gap:14px;height:calc(100vh - 120px)}
.threads{overflow:auto;display:flex;flex-direction:column;gap:4px}
.threads button{justify-content:flex-start;text-align:left;white-space:normal;font-size:12px}
.convo{display:flex;flex-direction:column;min-height:0}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:4px}
.msg{max-width:84%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--acc);color:#1c0f09}
.msg.ai{align-self:flex-start;background:var(--panel2);border:1px solid var(--line)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.act{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--dim)}
.act.bad{color:var(--err);border-color:rgba(229,105,94,.4)}
.composer{display:flex;gap:8px;margin-top:10px}
.composer textarea{min-height:52px}
.center{min-height:100vh;display:grid;place-items:center;padding:20px}
.login{width:min(420px,100%)}
.login .card{padding:24px}
.login h1{font-size:20px;margin-bottom:4px}
.or{display:flex;align-items:center;gap:10px;color:var(--lo);font-size:12px;margin:14px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.keybox{font-family:var(--mono);font-size:13px;background:var(--field);border:1px dashed var(--acc);border-radius:10px;padding:12px;word-break:break-all}
.empty{color:var(--lo);padding:24px;text-align:center}
.spin{width:14px;height:14px;border:2px solid var(--line2);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:860px){.app{grid-template-columns:1fr}nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap}
  nav .me,nav .sep{display:none}main{padding:16px}.chat{grid-template-columns:1fr;height:auto}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* Aethron's admin console. It talks to ONE address — the `aethron` edge
   function — and to Supabase sign-in. No privileged key lives here: the
   function decides what each admin may do, and records every action. */
const CFG = (function(){
  const baked = /*__AE_CONFIG__*/{};
  let saved = {};
  try{ saved = JSON.parse(localStorage.ae_admin_cfg||'{}') }catch(e){}
  return Object.assign({fn:'',supabase:'',anon:''}, saved, baked);
})();
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jsq = s => esc(JSON.stringify(String(s==null?'':s)));
const money = v => '$'+(+v||0).toFixed((+v||0)<1?4:2);
const n = v => (+v||0).toLocaleString();
function ago(t){ if(!t)return '—'; const s=(Date.now()-new Date(t).getTime())/1000;
  if(s<60)return Math.max(0,s|0)+'s ago'; if(s<3600)return (s/60|0)+'m ago'; if(s<86400)return (s/3600|0)+'h ago';
  return (s/86400|0)+'d ago'; }
function when(t){ return t? new Date(t).toLocaleString():'—' }
function flag(cc){ cc=String(cc||'').toUpperCase(); if(!/^[A-Z]{2}$/.test(cc))return '🌐';
  return String.fromCodePoint(...[...cc].map(c=>0x1F1E6+c.charCodeAt(0)-65)); }
function toast(msg,bad){ const t=document.createElement('div'); t.className='toast'+(bad?' err':''); t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), bad?6000:2600); }

/* ── sign-in ───────────────────────────────────────────────────── */
const AUTH = {
  get token(){ return sessionStorage.ae_tok||localStorage.ae_tok||'' },
  get refresh(){ return localStorage.ae_ref||'' },
  set(tok, ref, remember){ sessionStorage.ae_tok=tok; if(remember!==false)localStorage.ae_tok=tok;
    if(ref)localStorage.ae_ref=ref; },
  clear(){ delete sessionStorage.ae_tok; delete localStorage.ae_tok; delete localStorage.ae_ref; }
};
async function gotrue(path, body){
  const r = await fetch(CFG.supabase.replace(/\/+$/,'')+'/auth/v1/'+path,{method:'POST',
    headers:{'Content-Type':'application/json',apikey:CFG.anon},body:JSON.stringify(body)});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.msg||j.error_description||j.error||('sign-in failed ('+r.status+')'));
  return j;
}
async function tryRefresh(){
  if(!AUTH.refresh||!CFG.supabase)return false;
  try{ const j=await gotrue('token?grant_type=refresh_token',{refresh_token:AUTH.refresh});
    AUTH.set(j.access_token,j.refresh_token); return true; }catch(e){ return false }
}
async function req(path, opts={}){
  const go = () => fetch(CFG.fn.replace(/\/+$/,'')+path,{method:opts.method||(opts.body?'POST':'GET'),
    headers:{'Content-Type':'application/json',Authorization:'Bearer '+AUTH.token},
    body:opts.body?JSON.stringify(opts.body):undefined});
  let r = await go();
  if(r.status===401 && await tryRefresh()) r = await go();
  if(r.status===401){ AUTH.clear(); render(); throw new Error('signed out') }
  if(opts.raw) return r;
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error((j.error&&j.error.message)||r.statusText);
  return j;
}
async function T(tool, args={}){ return (await req('/admin/call',{body:{tool,args}})).result }
async function act(tool,args,okMsg){ try{ const r=await T(tool,args); toast(okMsg||'Done'); return r }
  catch(e){ toast(e.message,true); throw e } }

/* links from sign-in emails / Google land with the session in the hash */
(function(){
  const h = new URLSearchParams(location.hash.slice(1));
  if(h.get('access_token')){ AUTH.set(h.get('access_token'),h.get('refresh_token')); history.replaceState(null,'',location.pathname); }
})();

function loginView(){
  const needCfg = !CFG.fn;
  return `<div class="center"><div class="login"><div class="card stack">
    <div class="brand" style="padding:0"><span class="mk"></span><div>Aethron Admin<small>the team console</small></div></div>
    ${needCfg?`<div class="stack"><div class="dim">Point the console at your Aethron function.</div>
      <div><label>Function address</label><input id="cfn" placeholder="https://xxxx.supabase.co/functions/v1/aethron"></div>
      <div><label>Supabase address</label><input id="csb" placeholder="https://xxxx.supabase.co"></div>
      <div><label>Supabase public (anon) key</label><input id="can" placeholder="eyJ…"></div>
      <button class="primary" onclick="saveCfg()">Save</button></div>`:`
    <div><label>Email</label><input id="lem" type="email" autocomplete="username"></div>
    <div><label>Password</label><input id="lpw" type="password" autocomplete="current-password"
      onkeydown="if(event.key==='Enter')signIn()"></div>
    <div class="row"><button class="primary" onclick="signIn()">Sign in</button>
      <button class="tight" onclick="magic()">Email me a link</button></div>
    <button onclick="google()">Continue with Google</button>
    <div class="or">or</div>
    <div><label>Admin API key</label><input id="lkey" type="password" placeholder="ak_… or the master key"
      onkeydown="if(event.key==='Enter')keyIn()"></div>
    <button onclick="keyIn()">Use key</button>
    <div class="lo" style="font-size:12px">Only accounts the team allows can sign in. Every action is recorded.</div>`}
  </div></div></div>`;
}
function saveCfg(){ const c={fn:$('cfn').value.trim(),supabase:$('csb').value.trim(),anon:$('can').value.trim()};
  localStorage.ae_admin_cfg=JSON.stringify(c); Object.assign(CFG,c); render(); }
async function signIn(){ try{ const j=await gotrue('token?grant_type=password',{email:$('lem').value.trim(),password:$('lpw').value});
  AUTH.set(j.access_token,j.refresh_token); await boot(); }catch(e){ toast(e.message,true) } }
async function magic(){ try{ await gotrue('otp',{email:$('lem').value.trim(),create_user:false,
  options:{email_redirect_to:location.origin+location.pathname}}); toast('Check your email for the sign-in link'); }catch(e){ toast(e.message,true) } }
function google(){ location.href=CFG.supabase.replace(/\/+$/,'')+'/auth/v1/authorize?provider=google&redirect_to='+
  encodeURIComponent(location.origin+location.pathname); }
async function keyIn(){ AUTH.set($('lkey').value.trim(),'',false); await boot(); }
function signOut(){ AUTH.clear(); ME=null; render(); }

/* ── shell ─────────────────────────────────────────────────────── */
let ME=null, VIEW=(location.hash.slice(1)||'overview'), TICK=null;
const NAV = [
  ['overview','Overview'],['live','Live now'],['users','Users'],['sep'],
  ['controls','Switches'],['ai','AI & models'],['usage','Usage & spend'],['sep'],
  ['errors','Errors'],['activity','Activity'],['runs','Agent runs'],['audit','Audit log'],['sep'],
  ['assistant','Admin AI'],['access','API keys & MCP'],['exports','Exports'],
];
function can(s){ return ME && ME.scopes.includes(s) }
function shell(inner){
  return `<div class="app"><nav>
    <div class="brand"><span class="mk"></span><div>Aethron<small>Admin console</small></div></div>
    ${NAV.map(([k,l])=>k==='sep'?'<div class="sep"></div>':`<a href="#${k}" class="${VIEW===k?'on':''}" onclick="go('${k}');return false">${l}</a>`).join('')}
    <div class="me">${esc(ME.actor)}<br>${esc(ME.role)} · ${esc(ME.scopes.join(', '))}<br>
      <a href="#" onclick="signOut();return false">Sign out</a> · <a href="#" onclick="theme();return false">theme</a></div>
  </nav><main id="main">${inner}</main></div>`;
}
function theme(){ const r=document.documentElement; r.dataset.theme=r.dataset.theme==='light'?'dark':'light';
  localStorage.ae_theme=r.dataset.theme; }
if(localStorage.ae_theme)document.documentElement.dataset.theme=localStorage.ae_theme;
function go(v){ VIEW=v; location.hash=v; render(); }
async function boot(){ try{ ME=await req('/admin/me') }catch(e){ if(AUTH.token)toast(e.message,true); ME=null } render(); }
async function render(){
  clearInterval(TICK); TICK=null;
  const root=$('root');
  if(!AUTH.token||!ME){ root.innerHTML=loginView(); return }
  root.innerHTML=shell('<div class="empty"><span class="spin"></span></div>');
  try{ $('main').innerHTML = await (VIEWS[VIEW]||VIEWS.overview)() }
  catch(e){ $('main').innerHTML=`<div class="card err">${esc(e.message)}</div>` }
}
async function refreshView(){ try{ $('main').innerHTML = await (VIEWS[VIEW]||VIEWS.overview)() }catch(e){} }
function head(title, extra=''){ return `<div class="top"><h1>${esc(title)}</h1>${extra}<button onclick="refreshView()">Refresh</button></div>` }
function tile(label, val, sub=''){ return `<div class="card kpi"><h3>${esc(label)}</h3><div class="n">${val}</div><div class="s">${sub}</div></div>` }
function barList(rows, key='key', val='count'){
  const max=Math.max(1,...rows.map(r=>+r[val]||0));
  return rows.length?`<div class="stack">${rows.map(r=>`<div><div style="display:flex;justify-content:space-between;font-size:13px">
    <span>${esc(r[key])}</span><span class="lo num">${n(r[val])}</span></div><div class="bar"><i style="width:${(+r[val]||0)/max*100}%"></i></div></div>`).join('')}</div>`
    :'<div class="empty">nothing yet</div>';
}

/* ── views ─────────────────────────────────────────────────────── */
const VIEWS = {};

VIEWS.overview = async () => {
  const o = await T('overview');
  const c = o.control;
  TICK = setInterval(()=>{ if(VIEW==='overview')refreshView() }, 30000);
  return head('Overview', `<span class="pill ${c.paused?'err':'ok'}"><span class="dot ${c.paused?'':'on'}"></span>${c.paused?'PAUSED':'Running'}</span>
      <span class="pill">AI: ${esc(c.ai_mode)}${o.managed.model?' · '+esc(o.managed.model):''}</span>`)+`
  ${c.paused?`<div class="kill on" style="margin-bottom:14px"><div style="flex:1"><div class="big">Aethron is paused for everyone</div>
    <div class="dim">${esc(c.pause_message)}</div></div>${can('write')?'<button class="primary" onclick="resumeAll()">Resume</button>':''}</div>`:''}
  <div class="grid k4">
    ${tile('People',n(o.users.total),`+${o.users.new_24h} today · +${o.users.new_7d} this week`)}
    ${tile('Online now',n(o.online_users),`${n(o.online_now)} copies open`)}
    ${tile('Active in 24h',n(o.active_24h),'people or copies')}
    ${tile('AI spend today',money(o.spend.today),`${n(o.spend.requests_today)} requests · ${o.spend.errors_today} failed`)}
    ${tile('AI spend 30 days',money(o.spend.d30),`7 days: ${money(o.spend.d7)}`)}
    ${tile('Errors in 24h',`<span class="${o.errors_24h?'err':''}">${n(o.errors_24h)}</span>`,`${o.top_errors.length} kinds`)}
    ${tile('Agent runs 24h',n(o.agent_runs_24h),'MCP calls recorded')}
  </div>
  <div class="grid k2" style="margin-top:14px">
    <div class="card"><h3>Where people are (7 days)</h3>${barList(o.countries.map(x=>({key:flag(x.key)+' '+(x.key||'unknown'),count:x.count})))}</div>
    <div class="card"><h3>Top errors (24h)</h3>${o.top_errors.length?`<table>${o.top_errors.map(e=>`<tr class="click" onclick="errDetail(${jsq(e.fingerprint)})">
      <td><b>${esc(e.kind||'?')}</b> <span class="lo">${esc(e.step||'')}</span><div class="dim">${esc((e.category||'').slice(0,90))}</div></td>
      <td class="num">${e.count}×<div class="lo">${e.machines} copies</div></td></tr>`).join('')}</table>`:'<div class="empty">No errors in 24 hours.</div>'}</div>
    <div class="card"><h3>Versions in use</h3>${barList(o.versions.map(x=>({key:x.key||'unknown',count:x.count})))}</div>
    <div class="card"><h3>Quick switches</h3><div class="stack">
      <div class="kill ${c.paused?'on':''}"><div style="flex:1"><div class="big">Kill switch</div><div class="dim">Stops every copy, every agent and the MCP.</div></div>

  sh.onclick=()=>{d.remove();sh.remove()};
  d.innerHTML=`<div class="top"><h1>Error ${esc(fp)}</h1><button onclick="askAiAbout(${jsq(fp)})">Ask the admin AI</button>
    <button onclick="this.closest('.drawer').remove();document.querySelector('.shade')?.remove()">Close</button></div>
    ${rows.map(r=>{const rec=r.record||{};return `<div class="card stack" style="margin-bottom:12px">
      <div><b>${esc(r.kind)}</b> · ${esc(r.step||'')} · <span class="lo">${when(r.received_at)} · app ${esc(r.app_version||'?')} · copy ${esc(r.machine)}</span></div>
      <div class="dim">${esc(r.category||'')}</div>${r.source_url?`<div class="lo mono">${esc(r.source_url)}</div>`:''}
      ${rec.lines&&rec.lines.length?`<pre>${esc(rec.lines.join('\n'))}</pre>`:''}${rec.error?`<pre>${esc(rec.error)}</pre>`:''}
      ${rec.trace?`<details><summary>trace</summary><pre>${esc(rec.trace)}</pre></details>`:''}
      ${rec.log?`<details><summary>log</summary><pre>${esc(rec.log)}</pre></details>`:''}
      <details><summary class="lo">everything</summary><pre>${esc(JSON.stringify(rec,null,1))}</pre></details></div>`}).join('')}`;
}
function askAiAbout(fp){ document.querySelectorAll('.drawer,.shade').forEach(x=>x.remove()); PENDING_ASK='Look at error '+fp+
  ': what failed, who it hits, which version, and what you think the fix is.'; go('assistant'); }

    <div><label>Event</label><input id="ee" value="${esc(EVQ.event)}" placeholder="login, project_created, run_step…"></div>

      <td><b>${esc(e.event)}</b></td><td class="lo mono">${esc(String(e.user_id||'').slice(0,8))}</td><td class="lo mono">${esc(JSON.stringify(e.props||{}))}</td></tr>`).join('')}</table>`

};

    ${rows.map(r=>`<tr><td class="lo">${when(r.received_at)}</td><td>${esc(r.caller)}<div class="lo mono">${esc(r.machine)}</div></td><td><b>${esc(r.tool)}</b></td>

VIEWS.audit = async () => {
  const rows = await T('audit_log',{limit:500});
  return head('Audit log',`<button onclick="download('audit','md',90)">Download .md</button>`)+`<div class="card tw"><table><tr><th>When</th><th>Who</th><th>How</th><th>Action</th><th>On</th><th>Details</th></tr>
    ${rows.map(r=>`<tr><td class="lo" style="white-space:nowrap">${when(r.at)}</td><td>${esc(r.actor)}</td><td><span class="pill">${esc(r.via)}</span></td>
    <td><b>${esc(r.action)}</b></td><td>${esc(r.target)}</td><td class="lo mono">${esc(JSON.stringify(r.details||{}))}</td></tr>`).join('')}</table></div>`;
};

let THREAD='', PENDING_ASK='';
VIEWS.assistant = async () => {
  let threads=[]; try{ threads=await req('/admin/ai/threads') }catch(e){}
  let msgs=[]; if(THREAD){ try{ msgs=await req('/admin/ai/thread?id='+encodeURIComponent(THREAD)) }catch(e){} }
  setTimeout(()=>{ if(PENDING_ASK&&$('aiin')){ $('aiin').value=PENDING_ASK; PENDING_ASK=''; } const m=$('msgs'); if(m)m.scrollTop=m.scrollHeight; },0);
  return head('Admin AI',`<span class="pill">acts with your permissions · every change audited</span>`)+`<div class="chat">
    <div class="card threads"><button class="primary" onclick="THREAD='';refreshView()">New conversation</button>
      ${threads.map(t=>`<button class="${t.thread===THREAD?'on':''}" onclick="THREAD=${jsq(t.thread)};refreshView()">${esc(t.first)}<br><span class="lo">${ago(t.at)}</span></button>`).join('')}</div>
    <div class="card convo"><div class="msgs" id="msgs">${msgs.filter(m=>m.role==='user'||(m.role==='assistant'&&m.content)).map(m=>
      `<div class="msg ${m.role==='user'?'user':'ai'}">${esc(m.content)}</div>`).join('')||
      `<div class="empty">Ask it to read the logs, explain an error, find who is online, pause Aethron, change a model, write a report…<br><br>
       <span class="lo">“What broke today and for whom?” · “Who used the most AI this week?” · “Switch everyone to managed gemini-3.6-flash with a $0.30 daily allowance.”</span></div>`}</div>
      <div class="composer"><textarea id="aiin" placeholder="Ask the admin AI…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();askAi()}"></textarea>
      <button class="primary" id="aisend" onclick="askAi()">Send</button></div></div></div>`;
};
async function askAi(){
  const t=$('aiin'), m=t.value.trim(); if(!m)return;
  const box=$('msgs'); box.insertAdjacentHTML('beforeend',`<div class="msg user">${esc(m)}</div><div class="msg ai" id="aiwait"><span class="spin"></span></div>`);
  box.scrollTop=box.scrollHeight; t.value=''; $('aisend').disabled=true;
  try{ const r=await req('/admin/ai',{body:{message:m,thread:THREAD}}); THREAD=r.thread;
    $('aiwait').outerHTML=`<div class="msg ai">${esc(r.reply)}${r.actions.length?`<div class="acts">${r.actions.map(a=>`<span class="act ${a.ok?'':'bad'}" title="${esc(JSON.stringify(a.args))}">${a.ok?'✓':'✗'} ${esc(a.tool)}</span>`).join('')}</div>`:''}
      <div class="lo" style="font-size:11px;margin-top:6px">${r.steps} step(s) · ${money(r.cost_usd)}</div></div>`;
  }catch(e){ $('aiwait').outerHTML=`<div class="msg ai err">${esc(e.message)}</div>` }
  $('aisend').disabled=false; box.scrollTop=box.scrollHeight;
}

VIEWS.access = async () => {
  const [keys, admins] = await Promise.all([T('list_api_keys'), T('list_admins')]);
  const o=can('owner');
  const mcpUrl=CFG.fn.replace(/\/+$/,'')+'/mcp';
  return head('API keys & MCP')+`<div class="stack">
  <div class="card stack"><h3>Connect a coding agent</h3><div class="dim">Any agent can read the logs, run every admin tool and talk to the admin AI through the admin MCP server — with an API key below.</div>
    <div><label>MCP address (Streamable HTTP)</label><pre>${esc(mcpUrl)}</pre></div>
    <div><label>Claude Code</label><pre>claude mcp add --transport http aethron-admin ${esc(mcpUrl)} --header "Authorization: Bearer ak_YOUR_KEY"</pre></div>
    <div><label>Any MCP client (JSON)</label><pre>${esc(JSON.stringify({mcpServers:{'aethron-admin':{type:'http',url:mcpUrl,headers:{Authorization:'Bearer ak_YOUR_KEY'}}}},null,1))}</pre></div>
    <div><label>Plain HTTP</label><pre>curl -X POST ${esc(CFG.fn.replace(/\/+$/,''))}/admin/call -H "Authorization: Bearer ak_YOUR_KEY" -H "Content-Type: application/json" -d '{"tool":"overview","args":{}}'</pre></div></div>
  <div class="card stack"><h3>API keys</h3>
    ${o?`<div class="row"><div><label>Label (who it is for)</label><input id="kl" placeholder="claude-code on my Mac"></div>
      <div><label>Permissions</label><select id="ks"><option value="read">read — logs and reports only</option><option value="read,write">read + write — switches and people</option>
      <option value="read,write,owner">owner — everything, incl. keys</option></select></div><button class="primary tight" onclick="newKey()">Create key</button></div><div id="newkey"></div>`:''}
    <div class="tw"><table><tr><th>Label</th><th>Key</th><th>Permissions</th><th>Created</th><th>Last used</th><th></th></tr>
    ${keys.map(k=>`<tr><td>${esc(k.label)}</td><td class="mono">${esc(k.prefix)}…</td><td>${esc((k.scopes||[]).join(', '))}</td><td class="lo">${ago(k.created_at)} · ${esc(k.created_by)}</td>
      <td class="lo">${ago(k.last_used)}</td><td>${k.revoked_at?'<span class="pill err">revoked</span>':o?`<button class="danger" onclick="rvKey(${jsq(k.id)})">Revoke</button>`:''}</td></tr>`).join('')}</table></div></div>
  <div class="card stack"><h3>Who can sign in to the admin</h3>
    <table>${admins.map(a=>`<tr><td>${esc(a.email)}</td><td><span class="pill">${esc(a.role)}</span></td><td class="lo">${a.source==='ADMIN_EMAILS'?'set on the server':esc(a.added_by||'')}</td>
      <td>${o&&a.source!=='ADMIN_EMAILS'?`<button class="danger" onclick="rmAdmin(${jsq(a.email)})">Remove</button>`:''}</td></tr>`).join('')}</table>
    ${o?`<div class="row"><div><label>Email</label><input id="nae"></div><div><label>Role</label><select id="nar"><option>admin</option><option>viewer</option><option>owner</option></select></div>
      <button class="tight" onclick="addAdmin()">Add</button></div>`:''}</div>
  </div>`;
};
async function newKey(){ const r=await act('create_api_key',{label:$('kl').value.trim(),scopes:$('ks').value.split(',')},'Key created');
  $('newkey').innerHTML=`<div class="stack"><div class="dim">Copy it now — it is not shown again.</div><div class="keybox">${esc(r.key)}</div>
    <button class="tight" onclick="navigator.clipboard.writeText(${jsq(r.key)});toast('Copied')">Copy</button></div>`; }
async function rvKey(id){ if(!confirm('Revoke this key? Agents using it lose access at once.'))return; await act('revoke_api_key',{id},'Revoked'); refreshView(); }
async function addAdmin(){ await act('add_admin',{email:$('nae').value.trim(),role:$('nar').value},'Added'); refreshView(); }
async function rmAdmin(e){ if(!confirm('Remove '+e+' from the admin?'))return; await act('remove_admin',{email:e},'Removed'); refreshView(); }

VIEWS.exports = async () => {
  const kinds=[['all','Everything','overview, errors with logs, usage, users, admin actions'],['errors','Errors','grouped, with failing lines, logs and traces'],
    ['usage','AI usage','by person, model, day, purpose'],['users','Users','every account with country, version, spend'],
    ['events','Activity','the event stream'],['runs','Agent runs','what MCP agents did'],['audit','Admin actions','the audit log']];
  return head('Exports')+`<div class="card stack"><div class="row" style="max-width:320px"><div><label>Window (days)</label><input id="xd" value="7"></div></div>
    <table>${kinds.map(([k,l,d])=>`<tr><td><b>${l}</b><div class="lo">${d}</div></td><td style="text-align:right">
      <button onclick="download('${k}','md',+$('xd').value||7)">.md</button> <button onclick="download('${k}','json',+$('xd').value||7)">.json</button>
      <button onclick="download('${k}','csv',+$('xd').value||7)">.csv</button></td></tr>`).join('')}</table>
    <div class="lo">Markdown files are written to be handed to a person or a coding agent as they are.</div></div>`;
};
async function download(kind,format,days){
  try{ const r=await req(`/admin/export?kind=${kind}&format=${format}&days=${days}`,{raw:true});
    if(!r.ok)throw new Error('export failed ('+r.status+')');
    const cd=r.headers.get('content-disposition')||''; const name=(cd.match(/filename="([^"]+)"/)||[])[1]||`aethron-${kind}.${format}`;
    const url=URL.createObjectURL(await r.blob()); const a=document.createElement('a'); a.href=url; a.download=name; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
  }catch(e){ toast(e.message,true) }
}

window.addEventListener('hashchange',()=>{ const v=location.hash.slice(1); if(v&&v!==VIEW&&VIEWS[v]){VIEW=v;render()} });
if(AUTH.token) boot(); else render();
