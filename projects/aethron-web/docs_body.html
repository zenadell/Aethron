    <section class="hero" id="overview">
      <span class="eyebrow"><i></i>Aethron MCP</span>
      <h1>Use Aethron from your own coding agent.</h1>
      <p class="lede">Aethron's tools plug into the agent you already use (Claude, Codex, Gemini, Cursor, Antigravity and anything else that speaks MCP). Your agent decides what the site should say. Aethron does the delicate work and checks every page in a real browser before it calls anything finished.</p>
      <div class="plan" role="note">
        <span class="tag">STUDIO</span>
        <p><strong>The MCP is part of the Studio plan ($49 a month).</strong> It runs from the Aethron app on your own Mac, signed in with your Studio account. During the beta it is open to everyone. <a href="/pricing">See plans</a></p>
      </div>
    </section>

    <section class="doc rv" id="what">
      <h2>What your agent can do with it</h2>
      <p class="sub">Every step goes through Aethron's guarded pipeline, so an agent cannot break a template by editing files by hand.</p>
      <div class="cards">
        <div class="card"><span class="n">MIGRATE</span><h4>Own any template</h4><p>Pull a Framer or Webflow template (or any site) from its link, rewrite every word, image and link for your brand, and keep every animation.</p></div>
        <div class="card"><span class="n">CHECK</span><h4>Proof, not promises</h4><p>Builds are checked file by file and then opened in a real browser. A page that renders blank or shows a broken image fails, by name.</p></div>
        <div class="card"><span class="n">FIX & SHIP</span><h4>Heal, port, hand over</h4><p>Heal edits that did not land, port the site to Astro, Next or Vite, rebuild a page from a screenshot, and serve a preview.</p></div>
      </div>
    </section>

    <section class="doc rv" id="before">
      <h2>Before you start</h2>
      <ul class="rules">
        <li><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span><b>Install Aethron</b> in your Applications folder. <a href="/download">Download it here</a>. The MCP is the app itself; there is nothing else to install.</span></li>
        <li><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span><b>Open it once and sign in</b> with your Studio account, so this Mac knows your plan.</span></li>
        <li><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span><b>No AI key is needed for migrations.</b> Your agent writes the copy itself. Only a few tools (rebuilding a page from a screenshot, changing a page in plain words) use the AI provider you saved in the Aethron app.</span></li>
        <li><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span><b>Your projects stay on your Mac.</b> The agent and the Aethron app share the same projects, so anything your agent builds shows up in the app, and the other way round.</span></li>
      </ul>
    </section>

    <section class="doc rv" id="connect">

      <p class="sub">Every agent starts the same command: <code>/Applications/Aethron.app/Contents/MacOS/Aethron --mcp</code>. Pick yours below. Menu names can move between versions of each app; the setting is always "MCP servers".</p>

        <button role="tab" aria-selected="true" aria-controls="t-claude-code" id="b-claude-code">Claude Code</button>
        <button role="tab" aria-selected="false" aria-controls="t-claude-desktop" id="b-claude-desktop">Claude Desktop</button>
        <button role="tab" aria-selected="false" aria-controls="t-codex" id="b-codex">Codex</button>

        <button role="tab" aria-selected="false" aria-controls="t-other" id="b-other">Any other</button>
      </div>

<pre><code>claude mcp add aethron --scope user -- /Applications/Aethron.app/Contents/MacOS/Aethron --mcp</code></pre>

    <section class="doc rv" id="first">
      <h2>Your first migration</h2>
      <p class="sub">You can simply tell your agent: <em>"Use Aethron to migrate https://yourtemplate.framer.website for my studio, Northwind. We design kitchens in Lisbon."</em> This is the path it will take.</p>
      <ol class="flow">
        <li><div><code>create_project</code><p>Takes the template's link (or an exported file) and reads every page.</p></div></li>
        <li><div><code>fetch</code> → <code>inventory</code><p>Downloads everything the site needs to run on its own, then lists every line of text, image and link.</p></div></li>
        <li><div><code>set_plan</code><p>Your brand, tone, contact details and anything to keep or remove. <code>learn_brand</code> can read your current site so the copy uses your real facts.</p></div></li>
        <li><div><code>get_content</code> → <code>set_content_bulk</code><p>Your agent reads 40 lines at a time and writes the new copy. Aethron refuses a line that would not fit or would break the page, and says why.</p></div></li>
        <li><div><code>build</code> → <code>verify</code> → <code>probe</code><p>Builds the site, checks the files, then opens every page in a real browser. If something fails, <code>heal</code> fixes what it safely can.</p></div></li>
        <li><div><code>serve_preview</code><p>Hands you a link to look at. The finished site is a folder you can host anywhere, or port with <code>convert_framework</code>.</p></div></li>
      </ol>
    </section>

    <section class="doc rv" id="tools">
      <h2>All the tools</h2>
      <p class="sub">Your agent sees each tool's full instructions when it connects. This is the short version.</p>
      <div class="groups">
        <details class="group" open><summary>Projects <span>6 tools</span></summary>
          <div class="tool"><code>list_projects</code><p>Every project, with its platform, how much is filled and whether it is built.</p></div>
          <div class="tool"><code>create_project</code><p>Start from a Framer or Webflow link, any website, or an exported file, folder or zip.</p></div>
          <div class="tool"><code>fetch</code><p>Download everything the site needs to run on its own.</p></div>
          <div class="tool"><code>inventory</code><p>List every line of text, image and link that can change.</p></div>
          <div class="tool"><code>figma_import</code><p>Start from a Figma design instead of a live site.</p></div>
          <div class="tool"><code>delete_project</code><p>Delete a project for good (asks for confirmation).</p></div>
        </details>
        <details class="group"><summary>Plan &amp; copy <span>7 tools</span></summary>
          <div class="tool"><code>get_plan</code> · <code>set_plan</code><p>Read and save the brief: brand, tone, contacts.</p></div>
          <div class="tool"><code>learn_brand</code><p>Read the brand's own site or documents so copy uses real facts.</p></div>
          <div class="tool"><code>search_brand</code><p>Ask what the brand material says about something.</p></div>
          <div class="tool"><code>get_content</code><p>Read the lines to fill, 40 at a time, only the unfilled ones if asked.</p></div>
          <div class="tool"><code>set_content</code> · <code>set_content_bulk</code><p>Write new copy. Each line is checked before it is taken.</p></div>

        <details class="group"><summary>Look &amp; structure <span>6 tools</span></summary>

          <div class="tool"><code>build</code><p>Rebuild the site from the original and your changes.</p></div>

          <div class="tool"><code>probe</code><p>Open every page in a real browser and report blank pages, failed requests and errors.</p></div>

          <div class="tool"><code>design_review</code><p>Check a page like a designer: type scale, spacing, contrast, tap targets.</p></div>

    <section class="doc rv" id="rules">
      <h2>Rules your agent follows</h2>
      <p class="sub">Aethron enforces these itself. They are here so you know why your agent sometimes takes the longer road.</p>
      <ul class="rules">
        <li><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"/></svg><span><b>Never hand-edit the project's files.</b> Template pages are rebuilt by their own code when they load, so a hand edit disappears or breaks the page. Every change goes through the tools.</span></li>
        <li><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"/></svg><span><b>A refusal is information.</b> When Aethron rejects a line (too long for its slot, a character that would break code), it says why. Your agent shortens it and sends it again.</span></li>
        <li><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"/></svg><span><b>The checks decide when it is done, not the agent.</b> A site is finished when <code>verify</code> and <code>probe</code> pass, and their FAIL lines are reported word for word.</span></li>
        <li><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"/></svg><span><b>Nothing is lost.</b> Every change keeps a snapshot, and <code>undo</code> keeps what it replaced.</span></li>
      </ul>
    </section>

    <section class="doc rv faq" id="trouble">
      <h2>Troubleshooting</h2>
      <details><summary>My agent does not see any Aethron tools</summary><p>Check the path: Aethron must be in <code>/Applications</code>. Restart the agent after changing its config, and use its MCP list (<code>/mcp</code> in Claude Code, Codex and Gemini CLI) to see the error.</p></details>
      <details><summary>"Aethron's MCP is part of the Studio plan"</summary><p>Open the Aethron app and sign in with your Studio account. If you upgraded recently, opening the app while online confirms the new plan; then ask your agent to try again.</p></details>
      <details><summary>A step times out</summary><p>Downloading a large template or building it can take a few minutes. Raise your agent's tool timeout to 10 minutes (see your agent's tab above), then ask it to run the step again.</p></details>
      <details><summary>macOS says it cannot check Aethron</summary><p>Open the app once from Finder first. If macOS blocks it, go to System Settings → Privacy &amp; Security and click Open Anyway. After that, agents can start it.</p></details>
      <details><summary>Where are my projects?</summary><p>In Aethron's data folder on your Mac (<code>~/Library/Application Support/Aethron</code>), the same place the app uses. Ask your agent to run <code>list_projects</code>.</p></details>
      <details><summary>Something broke and the checks do not say why</summary><p>Ask your agent to run <code>probe</code> on the project and paste its FAIL lines to us at <a href="/start?type=help">aethron.jomiez.com/start</a>. A person replies within one business day.</p></details>
    </section>

</div>

<script data-ae-docs>
(function(){
  var TITLE='Docs · Use Aethron from your coding agent';
  var HOME='/docs', left=false, ready=false;
  function here(){return (location.pathname.replace(/\/$/,'')||'/')===HOME}
  function place(){
    if(!ready)return;
    var css=document.querySelector('style[data-ae-docs]');
    if(!here()){
      left=true;if(css)css.disabled=true;
      var r=document.getElementById('ae-docs');if(r)r.remove();
      if(document.title===TITLE)document.title='Aethron';
      return;
    }
    if(left){location.reload();return}
    if(css)css.disabled=false;
    var tpl=document.getElementById('ae-docs-tpl');if(!tpl)return;
    var cta=document.querySelector('#main section[data-framer-name="CTA"]');if(!cta)return;
    var root=document.getElementById('ae-docs');
    if(!root){root=tpl.content.firstElementChild.cloneNode(true);wire(root)}
    if(root.nextElementSibling!==cta)cta.parentNode.insertBefore(root,cta);
    if(document.title!==TITLE)document.title=TITLE;
  }
  function wire(root){
    var tabs=[].slice.call(root.querySelectorAll('[role=tab]'));
    function pick(b,focus){tabs.forEach(function(t){var on=t===b;t.setAttribute('aria-selected',on);t.tabIndex=on?0:-1;
      var p=root.querySelector('#'+t.getAttribute('aria-controls'));if(p)p.hidden=!on});if(focus)b.focus();
      try{localStorage.setItem('ae-docs-agent',b.id)}catch(e){}}
    tabs.forEach(function(t,i){t.addEventListener('click',function(){pick(t)});
      t.addEventListener('keydown',function(e){var d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(d){e.preventDefault();pick(tabs[(i+d+tabs.length)%tabs.length],true)}})});
    try{var sv=localStorage.getItem('ae-docs-agent');var sb=sv&&root.querySelector('#'+sv);if(sb)pick(sb)}catch(e){}
    [].forEach.call(root.querySelectorAll('pre'),function(p){var b=document.createElement('button');b.className='copy';b.type='button';b.textContent='Copy';
      b.addEventListener('click',function(){var t=p.querySelector('code').innerText;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){
        b.textContent='Copied';b.classList.add('done');setTimeout(function(){b.textContent='Copy';b.classList.remove('done')},1600)},function(){b.textContent='Select and copy'})});p.appendChild(b)});
    /* in-page links scroll; Framer's router must not treat #ids as routes */
    root.addEventListener('click',function(e){var a=e.target.closest('a[href^="#"]');if(!a)return;
      var t=root.querySelector(a.getAttribute('href'));if(!t)return;e.preventDefault();e.stopPropagation();
      t.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
      history.replaceState(history.state,'',HOME+a.getAttribute('href'))},true);
    var links=[].slice.call(root.querySelectorAll('.toc a'));
    if('IntersectionObserver' in window){
      var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{rootMargin:'0px 0px -8% 0px'});
      [].forEach.call(root.querySelectorAll('.rv'),function(s){io.observe(s)});
      var spy=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){var id=e.target.id;
        links.forEach(function(a){a.classList.toggle('on',a.getAttribute('href')==='#'+id)})}})},{rootMargin:'-30% 0px -60% 0px'});
      links.forEach(function(a){var s=root.querySelector(a.getAttribute('href'));if(s)spy.observe(s)});
    }else [].forEach.call(root.querySelectorAll('.rv'),function(s){s.classList.add('in')});
    setTimeout(function(){if(location.hash){var t=root.querySelector(location.hash);if(t)t.scrollIntoView()}},50);
  }
  function start(){
    if(ready)return;ready=true;
    if(window.__aeDocsPath){history.replaceState(history.state,'',window.__aeDocsPath);window.__aeDocsPath=null}
    place();
    new MutationObserver(function(){place()}).observe(document.documentElement,{childList:true,subtree:true});
  }
  function later(){requestAnimationFrame(function(){setTimeout(start,400)})}
  if(document.readyState==='complete')later();else window.addEventListener('load',later);
  setTimeout(start,6000);
  window.addEventListener('popstate',function(){setTimeout(place,0)});
})();
</script>
